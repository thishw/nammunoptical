name: Deploy site

# Every push to main is published: npm ci → astro build → the same audit as check.yml → GitHub Pages.
# The site is fully static; store facts live in src/data/store.ts, so there is nothing to fetch at build time.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue deployments instead of cancelling one in flight — keeps publish order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Build
        # site URL is fixed in astro.config.mjs (SITE_URL). Never override it here.
        run: npm run build
      - name: "Gate: links, meta, JSON-LD, NAP, brand wording, banned words"
        run: python3 scripts/audit_site.py dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
