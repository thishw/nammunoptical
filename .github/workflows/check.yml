name: Check

# The review gate for pull requests: the site builds, passes the store-facts audit
# (links, h1, canonical, JSON-LD, NAP, brand wording, banned words), and no page scrolls
# sideways on a phone. Runs without secrets, so it works on pull requests from forks.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Build
        id: build
        run: npm run build
      - name: Audit (links, meta, JSON-LD, NAP, brand wording, banned words)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/audit_site.py dist
      - name: No page scrolls sideways at 390px (Chrome preinstalled on ubuntu-latest)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          google-chrome --version
          python3 scripts/check_overflow.py --dist dist
      - name: Upload the built site for visual review
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 14
